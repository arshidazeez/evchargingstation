<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VoltVault - Premium EV Charging</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --electric-purple: #b967ff;
            --cyber-blue: #0066ff;
            --dark-space: #0a0e17;
            --space-gray: #1a1f2e;
            --light-space: #2a3042;
            --pure-white: #ffffff;
            --success-green: #00ff88;
            --error-red: #ff4757;
            --warning-yellow: #ffcc00;
            --glow-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            --purple-glow: 0 0 25px rgba(185, 103, 255, 0.4);
            --gradient-1: linear-gradient(135deg, #0066ff 0%, #00f3ff 50%, #b967ff 100%);
            --gradient-2: linear-gradient(45deg, #b967ff 0%, #0066ff 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--pure-white);
            background-color: var(--dark-space);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 10% 20%, rgba(0, 102, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(185, 103, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 70%);
            z-index: -1;
        }

        .floating-elements {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .float-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            animation: float 20s infinite linear;
        }

        .float-1 {
            width: 300px;
            height: 300px;
            background: var(--neon-blue);
            top: 10%;
            right: 10%;
            animation-delay: 0s;
        }

        .float-2 {
            width: 200px;
            height: 200px;
            background: var(--electric-purple);
            bottom: 15%;
            left: 10%;
            animation-delay: 5s;
        }

        .float-3 {
            width: 150px;
            height: 150px;
            background: var(--cyber-blue);
            top: 50%;
            right: 20%;
            animation-delay: 10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 450px;
            z-index: 10;
        }

        .logo-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        .logo-icon {
            color: var(--neon-blue);
            font-size: 2.5rem;
            text-shadow: 0 0 15px var(--neon-blue);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .logo-tagline {
            color: #b0b7d0;
            font-size: 1rem;
            margin-top: 5px;
        }

        .login-card {
            background: rgba(26, 31, 46, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: var(--glow-shadow);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--gradient-1);
        }

        .login-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.1) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .card-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .card-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .card-header p {
            color: #b0b7d0;
            font-size: 1rem;
        }

        .location-notice {
            background: rgba(0, 102, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: slideInDown 0.5s ease;
        }

        .location-notice i {
            color: var(--neon-blue);
            font-size: 1.2rem;
            margin-top: 2px;
        }

        .location-notice p {
            color: #b0b7d0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            color: #b0b7d0;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: var(--neon-blue);
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--pure-white);
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-blue);
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .form-input:focus + .input-icon {
            color: var(--electric-purple);
        }

        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #b0b7d0;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: var(--neon-blue);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-container input {
            display: none;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .checkbox-container input:checked + .custom-checkbox {
            background: var(--gradient-1);
            border-color: transparent;
        }

        .custom-checkbox::after {
            content: '✓';
            color: var(--dark-space);
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .checkbox-container input:checked + .custom-checkbox::after {
            opacity: 1;
        }

        .remember-text {
            color: #b0b7d0;
            font-size: 0.9rem;
            user-select: none;
        }

        .forgot-link {
            color: var(--neon-blue);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .forgot-link:hover {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Space Grotesk', sans-serif;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-1);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: var(--dark-space);
            box-shadow: var(--glow-shadow);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #b0b7d0;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--neon-blue);
            color: var(--pure-white);
            transform: translateY(-2px);
        }

        .location-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            background: rgba(0, 102, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: var(--neon-blue);
        }

        .location-btn:hover {
            background: rgba(0, 102, 255, 0.2);
            border-color: var(--neon-blue);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #7a819c;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
            font-size: 0.9rem;
        }

        .social-login {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.1);
            border-radius: 12px;
            color: #b0b7d0;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--neon-blue);
            color: var(--pure-white);
            transform: translateY(-2px);
        }

        .social-btn.google:hover {
            color: #ea4335;
        }

        .social-btn.apple:hover {
            color: #ffffff;
        }

        .social-btn.facebook:hover {
            color: #1877f2;
        }

        .register-link {
            text-align: center;
            margin-top: 30px;
            color: #b0b7d0;
            font-size: 0.95rem;
        }

        .register-link a {
            color: var(--neon-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .register-link a:hover {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        /* Form validation styles */
        .error-message {
            color: var(--error-red);
            font-size: 0.85rem;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s;
        }

        .error-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .form-input.error {
            border-color: var(--error-red);
        }

        .form-input.success {
            border-color: var(--success-green);
        }

        /* Location detection styles */
        .location-detection {
            background: rgba(26, 31, 46, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            display: none;
        }

        .location-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .location-header i {
            color: var(--neon-blue);
            font-size: 1.2rem;
        }

        .location-header h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            color: var(--pure-white);
        }

        .location-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .location-status i {
            font-size: 1rem;
        }

        .location-status.detecting {
            color: var(--warning-yellow);
            background: rgba(255, 204, 0, 0.1);
        }

        .location-status.success {
            color: var(--success-green);
            background: rgba(0, 255, 136, 0.1);
        }

        .location-status.error {
            color: var(--error-red);
            background: rgba(255, 71, 87, 0.1);
        }

        .location-coordinates {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .location-coordinates .input-wrapper {
            position: relative;
        }

        .location-coordinates .form-input {
            padding: 12px 15px 12px 40px;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            font-size: 0.9rem;
        }

        .location-coordinates .input-icon {
            left: 12px;
            font-size: 0.9rem;
            color: var(--success-green);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--neon-blue);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive design */
        @media (max-width: 576px) {
            .container {
                max-width: 100%;
            }

            .login-card {
                padding: 30px 25px;
            }

            .card-header h1 {
                font-size: 1.8rem;
            }

            .social-login {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .location-coordinates {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 400px) {
            .login-card {
                padding: 25px 20px;
            }

            .card-header h1 {
                font-size: 1.6rem;
            }

            .logo {
                font-size: 1.8rem;
            }

            .logo-icon {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating background elements -->
    <div class="floating-elements">
        <div class="float-circle float-1"></div>
        <div class="float-circle float-2"></div>
        <div class="float-circle float-3"></div>
    </div>

    <div class="container animate__animated animate__fadeIn">
        <!-- Logo and Header -->
        <div class="logo-header">
            <a href="#" class="logo">
                <i class="fas fa-bolt logo-icon"></i>
                <span>VoltVault</span>
            </a>
            <p class="logo-tagline">Find & book premium EV charging stations</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <!-- Card Header -->
            <div class="card-header">
                <h1>Forgot Password?</h1>
            </div>

            <!-- Login Form -->
            <form id="loginForm" method="post">
                {% csrf_token %}
                <!-- Email Address -->
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-input" name="email" placeholder="you@example.com" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                    <div class="error-message" id="emailError">
                        <i class="fas fa-exclamation-circle"></i> Please enter a valid email address
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> SEND OTP
                </button>

                <!-- Register Link -->
                <div class="register-link">
                    <a href="/login/">Back to login</a>
                </div>
            </form>
        </div>
    </div>

{% if msg %}
<script>alert('Invalid email');</script>
{% endif %}
</body>
</html>
